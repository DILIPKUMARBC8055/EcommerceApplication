replicaCount: 1

image:
  repository: postgres
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: "discountdb"

serviceAccount:
  create: false
  annotations: {}
  name: ""

podAnnotations:
  sidecar.istio.io/inject: "false"

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 5432

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

resources: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

env:
  POSTGRES_PASSWORD: "dilip1234"
  POSTGRES_USER: "admin"
  POSTGRES_DB: "DiscountDb"
  POSTGRES_HOST_AUTH_METHOD: "trust"
